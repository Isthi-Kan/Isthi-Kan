<svg width="100%" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7F5AF0"/>
    </linearGradient>

    <linearGradient id="wave1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7F5AF0" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="wave2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F5AF0" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-left" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7F5AF0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes floatWave {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-15px); }
      100% { transform: translateX(0px); }
    }
    .name-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Poppins', Roboto, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -0.5px;
      fill: #FFFFFF;
    }
    .role-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.5px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1px;
      fill: #38BDF8;
    }
    .wave-anim {
      animation: floatWave 8s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="240" rx="16" fill="url(#bg-grad)"/>

  <!-- Ambient Light Circles -->
  <rect width="1200" height="240" rx="16" fill="url(#glow-left)"/>
  <rect width="1200" height="240" rx="16" fill="url(#glow-right)"/>

  <!-- Background Tech Grid / Dots -->
  <g opacity="0.12">
    <circle cx="100" cy="40" r="1.5" fill="#00D9FF"/>
    <circle cx="200" cy="40" r="1.5" fill="#00D9FF"/>
    <circle cx="300" cy="40" r="1.5" fill="#00D9FF"/>
    <circle cx="400" cy="40" r="1.5" fill="#00D9FF"/>
    <circle cx="500" cy="40" r="1.5" fill="#00D9FF"/>
    <circle cx="600" cy="40" r="1.5" fill="#00D9FF"/>
    <circle cx="700" cy="40" r="1.5" fill="#00D9FF"/>
    <circle cx="800" cy="40" r="1.5" fill="#00D9FF"/>
    <circle cx="900" cy="40" r="1.5" fill="#00D9FF"/>
    <circle cx="1000" cy="40" r="1.5" fill="#00D9FF"/>
    <circle cx="1100" cy="40" r="1.5" fill="#00D9FF"/>

    <circle cx="100" cy="90" r="1.5" fill="#00D9FF"/>
    <circle cx="200" cy="90" r="1.5" fill="#00D9FF"/>
    <circle cx="300" cy="90" r="1.5" fill="#00D9FF"/>
    <circle cx="900" cy="90" r="1.5" fill="#00D9FF"/>
    <circle cx="1000" cy="90" r="1.5" fill="#00D9FF"/>
    <circle cx="1100" cy="90" r="1.5" fill="#00D9FF"/>
  </g>

  <!-- Fluid Waves at bottom -->
  <g class="wave-anim">
    <path d="M0 160 C 250 130, 450 190, 700 150 C 950 110, 1080 180, 1200 160 L1200 240 L0 240 Z" fill="url(#wave1-grad)"/>
    <path d="M0 185 C 200 155, 500 205, 800 165 C 1050 130, 1150 195, 1200 185 L1200 240 L0 240 Z" fill="url(#wave2-grad)"/>
  </g>

  <!-- Sleek Top Accent Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#primary-grad)"/>

  <!-- Content Container (Centered) -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Top Micro Badge -->
    <g transform="translate(0, -65)">
      <rect x="-160" y="-14" width="320" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
      <circle cx="-135" cy="0" r="4.5" fill="#10B981"/>
      <text x="12" y="4.5" class="badge-text" text-anchor="middle">OPEN TO HIGH-IMPACT ROLES</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="5" class="name-text">Mohamed Isthikan</text>

    <!-- Professional Subtitle -->
    <text x="0" y="40" class="role-text">
      Full-Stack Software Engineer <tspan fill="#38BDF8">|</tspan> AI Systems Developer <tspan fill="#818CF8">|</tspan> Mobile Architect
    </text>
  </g>

  <!-- Border Outline -->
  <rect width="1200" height="240" rx="16" fill="none" stroke="#1E293B" stroke-width="1"/>
</svg>
