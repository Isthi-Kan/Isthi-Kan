<svg width="100%" height="120" viewBox="0 0 1200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <linearGradient id="footer-wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F5AF0" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="footer-wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#7F5AF0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F5AF0"/>
      <stop offset="50%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#0A66C2"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="120" rx="16" fill="url(#footer-bg)"/>

  <!-- Fluid Waves -->
  <path d="M0 40 C 250 80, 480 20, 750 60 C 1020 100, 1120 30, 1200 50 L1200 120 L0 120 Z" fill="url(#footer-wave1)"/>
  <path d="M0 65 C 200 95, 520 45, 820 85 C 1070 115, 1150 60, 1200 70 L1200 120 L0 120 Z" fill="url(#footer-wave2)"/>

  <!-- Bottom Accent Line -->
  <rect x="0" y="117" width="1200" height="3" fill="url(#accent-line)"/>

  <!-- Border Outline -->
  <rect width="1200" height="120" rx="16" fill="none" stroke="#1E293B" stroke-width="1"/>
</svg>
